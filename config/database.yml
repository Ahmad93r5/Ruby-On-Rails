default: &default
  adapter: postgresql   # PostgreSQL database use karenge
  encoding: unicode     # Urdu/English sab support karega
  pool: 5               # 5 connections simultaneously
  timeout: 5000         # 5 seconds timeout

development:
  <<: *default
  database: backend_development   # Development database

test:
  <<: *default
  database: backend_test          # Testing database

production:
  <<: *default
  database: backend_production    # Production database